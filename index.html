<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICML 2026 Poster</title>
  <style>
    :root {
      --bg: #0b1020;
      --fg: #e8ecf1;
      --muted: #9aa6b2;
      --accent: #5b8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1a2444 0%, var(--bg) 60%);
      color: var(--fg);
      text-align: center;
      padding: 2rem;
    }
    main { max-width: 720px; }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      border: 1px solid rgba(91, 140, 255, 0.5);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin: 0 0 1rem;
      line-height: 1.1;
    }
    p { color: var(--muted); font-size: 1.1rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <span class="badge">ICML 2026</span>
    <h1>Poster Website</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
